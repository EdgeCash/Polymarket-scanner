[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-scanner"
version = "0.1.0"
description = "Alert-only live football scanner for Polymarket US (NFL and college football)"
requires-python = ">=3.12"
dependencies = [
    "polymarket-us==2.1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only the training script needs these. The running scanner never imports them.
train = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.setuptools.package-data]
scanner = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
